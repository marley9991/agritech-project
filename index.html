<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgriConnect — Farmer-to-Buyer Marketplace</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:      #0D1B2A;
  --navy-mid:  #152338;
  --navy-lit:  #1E3048;
  --green:     #2ECC71;
  --green-dim: #27AE60;
  --green-bg:  rgba(46,204,113,0.1);
  --yellow:    #F4C430;
  --yellow-bg: rgba(244,196,48,0.12);
  --red:       #E74C3C;
  --red-bg:    rgba(231,76,60,0.1);
  --blue:      #3498DB;
  --blue-bg:   rgba(52,152,219,0.1);
  --white:     #F0F4F8;
  --muted:     #7A8FA6;
  --border:    rgba(255,255,255,0.07);
  --border-em: rgba(255,255,255,0.15);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --sidebar-w: 240px;
  --font: 'Inter', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--navy);
  color: var(--white);
  font-size: 14px;
  line-height: 1.5;
  overflow-x: hidden;
}
button { font-family: var(--font); cursor: pointer; }
input, textarea, select { font-family: var(--font); }
a { color: inherit; text-decoration: none; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--navy-lit); border-radius: 2px; }

/* ── Layout ── */
#root { display: flex; height: 100vh; overflow: hidden; }

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--navy-mid);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  flex-shrink: 0;
  transition: transform 0.25s;
}
.sidebar-logo {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.logo-mark {
  display: flex; align-items: center; gap: 10px;
}
.logo-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--green); display: flex;
  align-items: center; justify-content: center;
  font-size: 18px; color: var(--navy); font-weight: 800;
}
.logo-text { font-size: 16px; font-weight: 800; color: var(--white); }
.logo-sub  { font-size: 10px; color: var(--muted); margin-top: 1px; }

.sidebar-section { padding: 16px 12px 8px; }
.sidebar-section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  color: var(--muted); text-transform: uppercase; padding: 0 8px; margin-bottom: 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: var(--radius-md);
  font-size: 13px; font-weight: 500; color: var(--muted);
  cursor: pointer; border: none; background: none; width: 100%;
  text-align: left; transition: all 0.15s;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--navy-lit); color: var(--white); }
.nav-item.active {
  background: var(--green-bg);
  color: var(--green);
  border: 1px solid rgba(46,204,113,0.2);
}
.nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; }
.nav-badge {
  margin-left: auto; background: var(--green); color: var(--navy);
  font-size: 10px; font-weight: 700; padding: 2px 6px;
  border-radius: 10px;
}

.sidebar-footer {
  margin-top: auto; padding: 16px 12px;
  border-top: 1px solid var(--border);
}
.user-pill {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-md);
  background: var(--navy-lit); cursor: pointer;
}
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--green); display: flex;
  align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: var(--navy);
  flex-shrink: 0;
}
.user-name { font-size: 12px; font-weight: 600; color: var(--white); }
.user-role { font-size: 10px; color: var(--muted); }

/* ── Main content ── */
.main {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
}
.topbar {
  height: 60px; background: var(--navy-mid);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 24px; gap: 16px; flex-shrink: 0;
}
.topbar-title { font-size: 16px; font-weight: 700; color: var(--white); flex: 1; }
.topbar-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--navy-lit); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 7px 12px; width: 240px;
}
.topbar-search input {
  background: none; border: none; outline: none;
  color: var(--white); font-size: 13px; width: 100%;
}
.topbar-search input::placeholder { color: var(--muted); }
.topbar-icon {
  width: 36px; height: 36px; border-radius: var(--radius-md);
  background: var(--navy-lit); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer; position: relative;
}
.notif-dot {
  position: absolute; top: 7px; right: 7px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--red); border: 1.5px solid var(--navy-mid);
}

.page { flex: 1; overflow-y: auto; padding: 24px; }

/* ── Cards ── */
.card {
  background: var(--navy-mid);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
}
.card-sm { padding: 14px 16px; }

/* ── Stats grid ── */
.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 24px; }
.stat-card {
  background: var(--navy-mid); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 18px;
}
.stat-label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; margin-bottom: 8px; }
.stat-value { font-size: 26px; font-weight: 800; color: var(--white); margin-bottom: 4px; }
.stat-change { font-size: 11px; }
.stat-change.up { color: var(--green); }
.stat-change.down { color: var(--red); }
.stat-accent { width: 36px; height: 36px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center; font-size: 18px;
  float: right; margin-top: -4px;
}

/* ── Tables ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; font-size: 11px; font-weight: 700;
  color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
}
td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--navy-lit); }

/* ── Badges ── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 700; padding: 3px 9px;
  border-radius: 20px;
}
.badge-green  { background: var(--green-bg);  color: var(--green);  }
.badge-yellow { background: var(--yellow-bg); color: var(--yellow); }
.badge-red    { background: var(--red-bg);    color: var(--red);    }
.badge-blue   { background: var(--blue-bg);   color: var(--blue);   }
.badge-muted  { background: var(--navy-lit);  color: var(--muted);  }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 16px; border-radius: var(--radius-md);
  font-size: 13px; font-weight: 600; border: none; cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--green); color: var(--navy); }
.btn-primary:hover { opacity: 0.9; }
.btn-secondary { background: var(--navy-lit); color: var(--white); border: 1px solid var(--border-em); }
.btn-secondary:hover { background: var(--navy-lit); border-color: var(--green); }
.btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid rgba(231,76,60,0.2); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-lg { padding: 13px 24px; font-size: 15px; border-radius: var(--radius-lg); }

/* ── Forms ── */
.form-group { margin-bottom: 16px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: block; }
.form-input, .form-select, .form-textarea {
  width: 100%; background: var(--navy-lit);
  border: 1px solid var(--border-em); border-radius: var(--radius-md);
  padding: 10px 14px; color: var(--white); font-size: 13px; outline: none;
  transition: border-color 0.15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--green); }
.form-input::placeholder { color: var(--muted); }
.form-select option { background: var(--navy-mid); }
.form-textarea { resize: vertical; min-height: 90px; }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

/* ── Marketplace ── */
.market-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
.produce-card {
  background: var(--navy-mid); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden; cursor: pointer;
  transition: border-color 0.2s, transform 0.2s;
}
.produce-card:hover { border-color: rgba(46,204,113,0.4); transform: translateY(-2px); }
.produce-img {
  height: 120px; background: var(--navy-lit);
  display: flex; align-items: center; justify-content: center; font-size: 52px;
}
.produce-body { padding: 14px; }
.produce-name { font-size: 14px; font-weight: 700; color: var(--white); margin-bottom: 3px; }
.produce-farmer { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.produce-footer { display: flex; justify-content: space-between; align-items: center; }
.produce-price { font-size: 16px; font-weight: 800; color: var(--yellow); }

/* ── Order detail ── */
.order-hero {
  background: linear-gradient(135deg, var(--navy-lit), rgba(46,204,113,0.08));
  border: 1px solid rgba(46,204,113,0.2);
  border-radius: var(--radius-xl); padding: 24px; margin-bottom: 20px;
}

/* ── Map ── */
.map-box {
  background: var(--navy-lit); border-radius: var(--radius-lg);
  height: 240px; position: relative; overflow: hidden;
  border: 1px solid var(--border);
}
.map-grid-bg {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 32px 32px;
}
.map-road-h { position: absolute; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.06); }
.map-road-v { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.06); }
.map-route-line {
  position: absolute; top: 38%; left: 15%; right: 12%; height: 3px;
  background: var(--green); border-radius: 2px;
  box-shadow: 0 0 10px rgba(46,204,113,0.6);
}
.map-pin { position: absolute; font-size: 24px; transform: translateX(-50%); }
.map-truck-icon {
  position: absolute; font-size: 20px;
  animation: truck-anim 4s ease-in-out infinite;
}
@keyframes truck-anim { 0%,100%{left:38%} 50%{left:55%} }
.map-eta {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  background: var(--navy); border: 1px solid var(--green);
  color: var(--green); font-size: 12px; font-weight: 700;
  padding: 5px 16px; border-radius: 20px; white-space: nowrap;
}

/* ── Progress stepper ── */
.stepper { display: flex; align-items: flex-start; margin: 20px 0; }
.step-item { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
.step-item::after {
  content: ''; position: absolute; top: 15px; left: 50%; right: -50%;
  height: 2px; background: var(--border);
}
.step-item:last-child::after { display: none; }
.step-item.done::after { background: var(--green); }
.step-dot {
  width: 30px; height: 30px; border-radius: 50%; position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; border: 2px solid var(--border);
  background: var(--navy-mid); color: var(--muted);
}
.step-item.done .step-dot { background: var(--green); border-color: var(--green); color: var(--navy); }
.step-item.current .step-dot { border-color: var(--yellow); color: var(--yellow); }
.step-label { font-size: 11px; color: var(--muted); margin-top: 6px; text-align: center; }
.step-item.done .step-label, .step-item.current .step-label { color: var(--white); }

/* ── Algo score ── */
.score-ring-wrap { display: flex; flex-direction: column; align-items: center; }
.score-number { font-size: 42px; font-weight: 800; }
.score-label { font-size: 12px; color: var(--muted); }

/* ── Driver match card ── */
.driver-match-card {
  background: linear-gradient(135deg, var(--navy-lit), rgba(46,204,113,0.06));
  border: 1.5px solid rgba(46,204,113,0.3);
  border-radius: var(--radius-lg); padding: 18px; margin-bottom: 10px;
}

/* ── Messaging ── */
.chat-container { display: flex; flex-direction: column; height: calc(100vh - 100px); }
.chat-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg-out {
  align-self: flex-end; max-width: 68%;
  background: var(--green-bg); border: 1px solid rgba(46,204,113,0.2);
  border-radius: 16px 16px 4px 16px; padding: 10px 14px;
  font-size: 13px; color: var(--white);
}
.msg-in {
  align-self: flex-start; max-width: 68%;
  background: var(--navy-lit); border: 1px solid var(--border);
  border-radius: 16px 16px 16px 4px; padding: 10px 14px;
  font-size: 13px; color: var(--white);
}
.msg-meta { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
.chat-footer {
  padding: 12px 20px; border-top: 1px solid var(--border);
  display: flex; gap: 10px;
}
.chat-input {
  flex: 1; background: var(--navy-lit); border: 1px solid var(--border-em);
  border-radius: var(--radius-lg); padding: 10px 16px;
  color: var(--white); font-size: 13px; outline: none;
}
.chat-input:focus { border-color: var(--green); }

/* ── Pulse ── */
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse-anim 1.5s infinite; margin-right: 6px; }
@keyframes pulse-anim { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.4)} }

/* ── USSD Terminal ── */
.ussd-terminal {
  background: #000; border-radius: var(--radius-md);
  padding: 20px; font-family: var(--mono); font-size: 13px;
  color: #00FF41; border: 1px solid #003300; min-height: 200px;
}
.ussd-cursor { display: inline-block; width: 8px; height: 14px; background: #00FF41; animation: blink 1s infinite; vertical-align: middle; }
@keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
.ussd-input-field {
  background: var(--navy-lit); border: 1px solid #00FF41;
  border-radius: var(--radius-md); padding: 10px 14px;
  color: #00FF41; font-family: var(--mono); font-size: 14px; outline: none;
}

/* ── Tab pills ── */
.tab-pills { display: flex; gap: 4px; padding: 4px; background: var(--navy-lit); border-radius: var(--radius-md); margin-bottom: 20px; }
.tab-pill {
  flex: 1; text-align: center; padding: 8px 12px;
  border-radius: 9px; font-size: 12px; font-weight: 600;
  color: var(--muted); cursor: pointer; border: none; background: none;
  transition: all 0.15s;
}
.tab-pill.active { background: var(--navy-mid); color: var(--white); border: 1px solid var(--border-em); }

/* ── Misc ── */
.section-title { font-size: 14px; font-weight: 700; color: var(--white); margin-bottom: 4px; }
.section-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
.row-label { font-size: 13px; color: var(--muted); }
.row-val { font-size: 13px; color: var(--white); font-weight: 500; }
.row-val-green { font-size: 13px; color: var(--green); font-weight: 600; }
.empty-state { text-align: center; padding: 48px 24px; color: var(--muted); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 14px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.flex-center { display: flex; align-items: center; gap: 10px; }
.mb-4 { margin-bottom: 4px; }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }
.mb-24 { margin-bottom: 24px; }
.mt-4 { margin-top: 4px; }
.mt-16 { margin-top: 16px; }
.text-muted { color: var(--muted); font-size: 12px; }
.text-green { color: var(--green); }
.text-yellow { color: var(--yellow); }
.text-red { color: var(--red); }
.font-mono { font-family: var(--mono); }
.toast-msg {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--green); color: var(--navy);
  padding: 12px 20px; border-radius: var(--radius-md);
  font-weight: 700; font-size: 13px; z-index: 9999;
  animation: slide-up 0.3s ease;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
}
@keyframes slide-up { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 24px;
}
.modal-box {
  background: var(--navy-mid); border: 1px solid var(--border-em);
  border-radius: var(--radius-xl); padding: 28px; width: 100%; max-width: 480px;
  max-height: 90vh; overflow-y: auto;
}
.modal-title { font-size: 18px; font-weight: 800; color: var(--white); margin-bottom: 4px; }
.modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
@media (max-width: 900px) {
  .sidebar { position: fixed; z-index: 100; height: 100%; transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .stats-grid { grid-template-columns: repeat(2,1fr); }
  .market-grid { grid-template-columns: repeat(2,1fr); }
  .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}

/* ── AgriConnect welcoming visual refresh ── */
:root {
  --navy: #f7f4ec;
  --navy-mid: #fffdf8;
  --navy-lit: #eef3e9;
  --green: #2f6b4f;
  --green-dim: #24543e;
  --green-bg: rgba(47,107,79,0.10);
  --yellow: #c4772d;
  --yellow-bg: rgba(196,119,45,0.12);
  --red: #c85b4c;
  --red-bg: rgba(200,91,76,0.10);
  --blue: #397a8e;
  --blue-bg: rgba(57,122,142,0.10);
  --white: #1f3328;
  --muted: #708077;
  --border: rgba(31,51,40,0.10);
  --border-em: rgba(31,51,40,0.18);
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --font: 'DM Sans', system-ui, sans-serif;
  --display: 'Plus Jakarta Sans', 'DM Sans', system-ui, sans-serif;
}
html { background: var(--navy); }
body { background: radial-gradient(circle at 100% 0%, #edf5e8 0, var(--navy) 34rem); color: var(--white); }
h1, h2, h3, .section-title, .modal-title, .topbar-title, .logo-text { font-family: var(--display); letter-spacing: -0.025em; }
button, input, textarea, select { font-family: var(--font); }
::selection { background: #d7e7d3; color: var(--white); }
::-webkit-scrollbar-thumb { background: #c9d8ca; }

.sidebar { background: rgba(255,253,248,0.92); border-right-color: var(--border); box-shadow: 12px 0 32px rgba(52,77,56,0.04); }
.sidebar-logo { padding: 26px 20px 20px; border-bottom-color: var(--border); }
.logo-icon { background: var(--green); color: #fffdf8; box-shadow: 0 8px 18px rgba(47,107,79,0.18); }
.logo-text, .user-name { color: var(--white); }
.logo-sub, .user-role { color: var(--muted); }

function clearAuth() {
  localStorage.removeItem('agri_token');

/* ── Spoilage score (mirrors backend algo) ── */
function computeSpoilageScore(harvestedAt, category, temp = 32) {
  const SHELF = { tomato:48, pepper:72, garden_egg:96, okra:36, leafy_greens:18, other:60 };
  const base = SHELF[category] || 60;
  const hours = (Date.now() - new Date(harvestedAt)) / 3_600_000;
  const adjusted = base / Math.pow(2, (temp-25)/5);
  return Math.min(Math.round((hours/adjusted)*100), 100);
}

function Dispatch({ onNavigate }) {

    apiFetch('/api/orders/1').then(data => { if (data) setLiveOrder(data); });
  }, []);
  const order = liveOrder || MOCK.orders[0];
  const score = computeSpoilageScore(order.harvested_at || MOCK.products[0].harvested_at,
    order.crop_category || MOCK.products[0].crop_category);
  const isUrgent = score > 60;

  async function runMatch() {
    setLoading(true);
    const result = await apiFetch('/api/logistics/match-driver', {
      method: 'POST',
      body: JSON.stringify({ order_id: 1, ambient_temp_c: 33 }),
    });
    setLoading(false);
    setMatched(true);
    if (result && result.matched_driver) {
      setToast(`Driver matched: ${result.matched_driver.full_name} — GHS ${result.matched_driver.estimated_cost}`);
    } else {
      setToast('Driver matched! Yaw is on the way.');

  const weights = isUrgent

    : [{l:'Distance to pickup',v:'40%',col:'var(--green)'},{l:'Cost per km',v:'25%',col:'var(--yellow)'},{l:'Load capacity',v:'20%',col:'var(--blue)'},{l:'Refrigeration bonus',v:'10%',col:'var(--blue)'},{l:'Driver rating',v:'5%',col:'var(--muted)'}];

  return <div className="page">
    {toast && <Toast message={toast} onDone={()=>setToast(null)} />}
    <div className="flex-between mb-24">
      <div>
        <h1 style={{fontSize:20,fontWeight:800}}>Smart Driver Matching</h1>
        <p className="text-muted">Algorithm finds the optimal driver for your order</p>
      </div>
      <Badge type={isUrgent?'yellow':'green'}>{isUrgent?'⚡ High Urgency':'✓ Normal'}</Badge>
    </div>

    <div className="grid-2 mb-24">
      <div className="card" style={{textAlign:'center'}}>
        <div className="section-title mb-4">Spoilage Score</div>
        <p className="text-muted" style={{marginBottom:16,fontSize:11}}>Crop age + ambient temp (33°C)</p>
        <div style={{position:'relative',width:120,height:120,margin:'0 auto 12px'}}>
          <svg viewBox="0 0 120 120" style={{transform:'rotate(-90deg)'}}>
            <circle cx="60" cy="60" r="52" fill="none" stroke="var(--navy-lit)" strokeWidth="10"/>

              stroke={score>70?'var(--red)':score>50?'var(--yellow)':'var(--green)'}

/* ── Messages ── */
function Messages() {
  const [msgs, setMsgs] = useState(MOCK.messages);
  const [input, setInput] = useState('');
  const bottomRef = useRef(null);
  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs]);

  function send() {
    if (!input.trim()) return;
    const now = new Date();
    const t = now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
    setMsgs(m=>[...m,{id:Date.now(),from:'me',sender:'You',text:input.trim(),time:t}]);
    setInput('');
    const replies = ["Got it! On my way.","No problem at all.","Will do, almost there.","Understood, driving carefully."];
    setTimeout(()=>{ const t2 = new Date(); setMsgs(m=>[...m,{id:Date.now()+1,from:'driver',sender:'Yaw Boateng',text:replies[Math.floor(Math.random()*replies.length)],time:t2.getHours()+':'+String(t2.getMinutes()).padStart(2,'0')}]); },1200);
  }

  return <div className="page" style={{padding:0,height:'100%'}}>
    <div className="chat-container">
      <div className="chat-header">
        <Avatar name="Yaw Boateng" size={40} />
        <div style={{flex:1}}>
          <div style={{fontWeight:700,color:'var(--white)'}}>Yaw Boateng</div>
          <div style={{fontSize:11,color:'var(--green)'}}><span className="pulse"></span>In Transit · Order #1001</div>
        </div>
        <Badge type="blue">Driver</Badge>
      </div>
      <div className="chat-messages">
        <div style={{textAlign:'center',fontSize:11,color:'var(--muted)',margin:'8px 0'}}>Today, June 16 2026</div>
        {msgs.map(m=><div key={m.id}>
          <div className={`msg-meta ${m.from==='me'?'':''}` } style={{textAlign:m.from==='me'?'right':'left'}}>{m.sender}, {m.time}</div>
          <div className={m.from==='me'?'msg-out':'msg-in'}>{m.text}</div>
        </div>)}
        <div ref={bottomRef}></div>
      </div>
      <div className="chat-footer">
        <input className="chat-input" value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Type a message..." />
        <button className="btn btn-primary" onClick={send}>Send →</button>
      </div>
    </div>
  </div>;
}

          {f.menu && <div style={{marginBottom:8,opacity:0.85}}>{f.menu}</div>}

            placeholder="Enter option..." disabled={step===flows.length-1} />

        </div>
        {step===flows.length-1 && <div style={{marginTop:8,fontSize:11,color:'var(--green)'}}>✓ Auto-resetting in 4s...</div>}

      <div>
        <div className="card mb-16">

/* ── Manual MTN MoMo verification ── */
function Payments({ onNavigate }) {
  const [payments, setPayments] = useState(() => JSON.parse(localStorage.getItem('agri_manual_payments') || '[]'));
  const [selected, setSelected] = useState(null);
  const [toast, setToast] = useState(null);
  function updatePayment(paymentId, status) {
    const next = payments.map(p => p.payment_id === paymentId ? {...p, status, verified_at:new Date().toISOString(), verified_by:'Demo Operations'} : p);
    setPayments(next); localStorage.setItem('agri_manual_payments', JSON.stringify(next)); setSelected(null);
    setToast(status === 'payment_verified' ? 'Payment verified — order ready for dispatch' : 'Payment rejected');
  }
  const submitted = payments.filter(p => p.status === 'payment_submitted');
  const verified = payments.filter(p => p.status === 'payment_verified');
  return <div className="page">
    {toast && <Toast message={toast} onDone={()=>setToast(null)} />}
    <div className="flex-between mb-24"><div><h1 style={{fontSize:20,fontWeight:800}}>MTN MoMo Payments</h1><p className="text-muted">Submit a reference after payment, then track verification status.</p></div><Badge type="yellow">Manual pilot</Badge></div>
    <div className="stats-grid">{[{label:'Awaiting verification',value:submitted.length,icon:'⌛'},{label:'Verified payments',value:verified.length,icon:'✓'},{label:'Payment channel',value:'MTN MoMo',icon:'📱'},{label:'PIN / OTP',value:'Never collected',icon:'🔒'}].map(s=><div className="stat-card" key={s.label}><div className="stat-accent" style={{background:'var(--green-bg)'}}>{s.icon}</div><div className="stat-label">{s.label}</div><div className="stat-value" style={{fontSize:20}}>{s.value}</div></div>)}</div>
    <div className="grid-2"><div className="card"><div className="section-title mb-8">How manual verification works</div><p className="text-muted" style={{lineHeight:1.7}}>The buyer sends the exact order amount to the approved AgriConnect MTN MoMo number, then submits the sender number and transaction reference. Operations verifies the payment before dispatch.</p><div className="divider"></div>{[['1','Send the exact amount','024 XXX XXXX'],['2','Submit reference','Keep the confirmation SMS'],['3','Operations verifies','Never share PIN or OTP']].map(([n,l,v])=><div className="row" key={n}><span style={{width:26,height:26,borderRadius:'50%',background:'var(--green)',color:'#fffdf8',display:'inline-flex',alignItems:'center',justifyContent:'center',fontWeight:800}}>{n}</span><span style={{flex:1,marginLeft:10}}><strong>{l}</strong><br/><span className="text-muted">{v}</span></span></div>)}</div><div className="card"><div className="section-title mb-16">Payment safety</div><div style={{padding:14,background:'var(--yellow-bg)',border:'1px solid rgba(196,119,45,.2)',borderRadius:'var(--radius-md)',fontSize:12,color:'var(--muted)',lineHeight:1.7}}>This pilot records payment references for operations review. It does not connect to MTN automatically and never asks for a MoMo PIN or OTP.</div><div className="divider"></div><div className="row"><span className="row-label">Approved number</span><strong>024 XXX XXXX</strong></div><div className="row"><span className="row-label">Release rule</span><strong>Verify before dispatch</strong></div></div></div>
    <div className="card mt-16" style={{padding:0,overflow:'hidden'}}><div style={{padding:'18px 20px',borderBottom:'1px solid var(--border)'}}><div className="section-title">Payment queue</div><div className="text-muted">Demo operations view</div></div>{payments.length ? payments.map(p=><div key={p.payment_id} style={{display:'flex',alignItems:'center',gap:12,padding:'16px 20px',borderBottom:'1px solid var(--border)',flexWrap:'wrap'}}><span style={{fontSize:28}}>{p.emoji||'📱'}</span><div style={{flex:1,minWidth:180}}><strong>Order #{p.order_id} · {p.crop_name}</strong><div className="text-muted">{p.payer_phone||'No payer number'} · Ref: {p.momo_reference||'Not submitted'}</div></div><div style={{textAlign:'right'}}><StatusBadge status={p.status}/><div style={{fontWeight:800,color:'var(--yellow)',marginTop:4}}>GHS {p.amount}</div></div>{p.status==='payment_submitted'&&<button className="btn btn-primary btn-sm" onClick={()=>setSelected(p)}>Review</button>}</div>) : <div className="empty-state"><div className="empty-icon">📱</div><div className="empty-text">No payment references submitted yet. Start from Marketplace checkout.</div><button className="btn btn-primary" style={{marginTop:16}} onClick={()=>onNavigate('market')}>Browse produce →</button></div>}</div>
    {selected && <Modal title={`Review Order #${selected.order_id}`} sub="Confirm the payment using your MTN MoMo records." onClose={()=>setSelected(null)}><div className="card card-sm mb-16"><div className="row"><span className="row-label">Amount expected</span><strong>GHS {selected.amount}</strong></div><div className="row"><span className="row-label">Payer number</span><strong>{selected.payer_phone}</strong></div><div className="row"><span className="row-label">Transaction reference</span><strong className="font-mono">{selected.momo_reference}</strong></div></div><div style={{display:'flex',gap:8}}><button className="btn btn-primary" style={{flex:1}} onClick={()=>updatePayment(selected.payment_id,'payment_verified')}>✓ Verify payment</button><button className="btn btn-danger" style={{flex:1}} onClick={()=>updatePayment(selected.payment_id,'payment_rejected')}>Reject</button></div></Modal>}
  </div>;
}

function FarmerOnboardingStatus({ status='in_review', requestNotes=[] }) {

function AuthPage({ onLogin }) {
  const [mode, setMode] = useState('login'); // 'login' | 'register'
  const [form, setForm] = useState({ phone_number:'', password:'', full_name:'', role:'buyer',
    business_name:'', farm_name:'', vehicle_type:'pickup_truck' });
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  function setF(k, v) { setForm(f => ({...f, [k]: v})); }

  async function handleSubmit() {
    setError(''); setLoading(true);
    try {
      const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
      const body = mode === 'login'
        ? { phone_number: form.phone_number, password: form.password }
        : { ...form };
      const res = await fetch(API_BASE + endpoint, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        const serverError = String(data.error || '');
        const isInfrastructureError = /getaddrinfo|enotfound|econnrefused|network|fetch failed/i.test(serverError);
        setError(isInfrastructureError
          ? 'AgriConnect is temporarily unavailable. Please try again in a moment.'
          : (data.error || 'We could not complete that request. Please check your details and try again.'));
        setLoading(false);
        return;
      }
      setAuth(data.token, data.user);

    <div style={{textAlign:'center',maxWidth:340}}>
      <div style={{fontSize:22,fontWeight:800,color:'var(--white)',marginBottom:8}}>
        Eliminating Post-Harvest Loss
      </div>
      <div style={{fontSize:13,color:'var(--muted)',lineHeight:1.7}}>
        Connecting smallholder farmers directly to buyers across Greater Accra, Volta, and Central regions —
        with smart logistics matching that moves produce before it spoils.
      </div>
    </div>

    <div style={{marginTop:24,display:'flex',alignItems:'center',gap:8}}>
      <div style={{width:6,height:6,borderRadius:'50%',background:'var(--green)'}}></div>
      <span style={{fontSize:11,color:'var(--muted)'}}>Supported by GDSS & GIZ PSInno Programme</span>
    </div>
  </div>;

  return <div className="auth-page" style={{display:'flex',height:'100vh',background:'var(--navy)'}}>
    {/* Left — Auth form */}
    <div className="auth-form-panel" style={{width:460,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',
      padding:32,overflowY:'auto',borderRight:'1px solid rgba(255,255,255,0.07)'}}>
    <div style={{width:'100%',maxWidth:400}}>
      {/* Logo */}
      <div style={{textAlign:'center',marginBottom:28}}>
        <div style={{width:52,height:52,borderRadius:14,background:'var(--green)',
          display:'flex',alignItems:'center',justifyContent:'center',
          fontSize:24,fontWeight:800,color:'var(--navy)',margin:'0 auto 10px'}}>A</div>
        <div style={{fontSize:22,fontWeight:800,color:'var(--white)'}}>AgriConnect</div>
        <div style={{fontSize:13,color:'var(--muted)',marginTop:4}}>Farm to Buyer. Direct.</div>
      </div>

      {/* Tab toggle */}
      <div style={{display:'flex',background:'var(--navy-lit)',borderRadius:12,padding:4,marginBottom:24}}>
        {['login','register'].map(m => <button key={m} onClick={()=>{setMode(m);setError('');}}
          style={{flex:1,padding:'9px 0',borderRadius:9,border:'none',cursor:'pointer',
            fontSize:13,fontWeight:600,transition:'all 0.15s',
            background:mode===m?'var(--navy-mid)':'transparent',
            color:mode===m?'var(--white)':'var(--muted)'}}>
          {m === 'login' ? 'Sign In' : 'Register'}
        </button>)}
      </div>

      <div className="card">
        {mode === 'register' && <>
          <div className="form-group">
            <label className="form-label">Full Name</label>
            <input className="form-input" placeholder="Kofi Mensah" value={form.full_name}
              onChange={e=>setF('full_name',e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">I am a...</label>
            <div style={{display:'flex',gap:8}}>
              {[['buyer','🛒 Buyer'],['farmer','🌱 Farmer'],['driver','🚛 Driver']].map(([r,l])=>
                <button key={r} onClick={()=>setF('role',r)}
                  style={{flex:1,padding:'10px 4px',borderRadius:10,border:'none',cursor:'pointer',
                    fontSize:12,fontWeight:600,
                    background:form.role===r?'var(--green)':'var(--navy-lit)',
                    color:form.role===r?'var(--navy)':'var(--muted)'}}>
                  {l}
                </button>)}
            </div>
          </div>
          {form.role==='buyer' && <div className="form-group">
            <label className="form-label">Business Name (optional)</label>
            <input className="form-input" placeholder="Kofi's Kitchen" value={form.business_name}
              onChange={e=>setF('business_name',e.target.value)} />
          </div>}
          {form.role==='farmer' && <div className="form-group">
            <label className="form-label">Farm Name (optional)</label>
            <input className="form-input" placeholder="Asante Fresh Farm" value={form.farm_name}
              onChange={e=>setF('farm_name',e.target.value)} />
          </div>}
          {form.role==='driver' && <div className="form-group">
            <label className="form-label">Vehicle Type</label>
            <select className="form-select" value={form.vehicle_type} onChange={e=>setF('vehicle_type',e.target.value)}>
              <option value="pickup_truck">Pickup Truck</option>
              <option value="box_truck">Box Truck</option>
              <option value="tricycle">Tricycle</option>
            </select>
          </div>}
        </>}

        <div className="form-group">
          <label className="form-label">Phone Number (MoMo)</label>
          <input className="form-input" type="tel" placeholder="+233 244 000 000"
            value={form.phone_number} onChange={e=>setF('phone_number',e.target.value)} />
        </div>
        <div className="form-group" style={{marginBottom:0}}>
          <label className="form-label">Password</label>
          <input className="form-input" type="password" placeholder="••••••••"
            value={form.password} onChange={e=>setF('password',e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&handleSubmit()} />
        </div>

        {error && <div style={{marginTop:12,padding:'10px 14px',background:'var(--red-bg)',
          border:'1px solid rgba(231,76,60,0.3)',borderRadius:10,fontSize:12,color:'var(--red)'}}>
          {error}
        </div>}

        <button onClick={handleSubmit} disabled={loading}
          className="btn btn-primary btn-lg" style={{width:'100%',marginTop:20}}>
          {loading ? 'Please wait...' : mode==='login' ? 'Sign In →' : 'Create Account →'}
        </button>
      </div>

    </div>
    </div>
    {/* Right — Illustration panel (hidden on small screens) */}
    <div style={{flex:1,display:'flex'}} className="auth-right-panel">
      <RightPanel />
    </div>
  </div>;
}

function App() {
  const [page, setPage] = useState('dashboard');
  const [toast, setToast] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  // Temporary demo bypass. Restore the AuthPage gate before production launch.
  const [currentUser, setCurrentUser] = useState(getUser() || MOCK.user);

  function navigate(p) { setPage(p); setSidebarOpen(false); }
  function switchDemoRole(role) { setCurrentUser(DEMO_USERS[role]); setPage('dashboard'); setSidebarOpen(false); }
  function handleLogin(user) { setCurrentUser(user); }
  function handleLogout() { clearAuth(); setCurrentUser(MOCK.user); }

  const pageTitles = { dashboard:'Dashboard', market:'Marketplace', orders:'My Orders',
    dispatch:'Driver Matching', tracking:'Live Tracking', messages:'Messages', payments:'MTN MoMo Payments', operations:'Farmer Review', inventory:'My Produce', earnings:'Earnings', jobs:'Delivery Jobs', ussd:'USSD Mode' };
  const visiblePage = p => !p.roles || p.roles.includes(currentUser.role);

  return <>
    {toast && <Toast message={toast} onDone={()=>setToast(null)} />}
    <div id="root" style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <nav className={`sidebar ${sidebarOpen?'open':''}`}>
        <div className="sidebar-logo">
          <div className="logo-mark">
            <div className="logo-icon">A</div>
            <div><div className="logo-text">AgriConnect</div><div className="logo-sub">Farmer-to-Buyer Marketplace</div></div>
          </div>
        </div>
        <div className="sidebar-section">
          <div className="sidebar-section-label">Main</div>
          {PAGES.slice(0,3).filter(visiblePage).map(p=><button key={p.id} className={`nav-item ${page===p.id?'active':''}`} onClick={()=>navigate(p.id)}>
            <span className="nav-icon">{p.icon}</span>{p.label}
            {p.badge && <span className="nav-badge">{p.badge}</span>}
          </button>)}
        </div>
        <div className="sidebar-section">
          <div className="sidebar-section-label">Logistics</div>
          {PAGES.slice(3,6).filter(visiblePage).map(p=><button key={p.id} className={`nav-item ${page===p.id?'active':''}`} onClick={()=>navigate(p.id)}>
            <span className="nav-icon">{p.icon}</span>{p.label}
            {p.badge && <span className="nav-badge">{p.badge}</span>}
          </button>)}
        </div>
        <div className="sidebar-section">
          <div className="sidebar-section-label">Bonus</div>
          {PAGES.slice(6).filter(visiblePage).map(p=><button key={p.id} className={`nav-item ${page===p.id?'active':''}`} onClick={()=>navigate(p.id)}>
            <span className="nav-icon">{p.icon}</span>{p.label}
          </button>)}
        </div>
        <div className="sidebar-footer">
          <div className="user-pill" style={{cursor:'default'}}>
            <Avatar name={currentUser.full_name} size={32} />
            <div style={{flex:1,minWidth:0}}>
              <div className="user-name">{currentUser.full_name}</div>
              <div className="user-role" style={{textTransform:'capitalize'}}>{currentUser.role}{currentUser.business_name?' · '+currentUser.business_name:''}</div>
            </div>
          </div>
        </div>
      </nav>

      <div className="main">
        <div className="topbar">
          <button className="topbar-icon" onClick={()=>setSidebarOpen(s=>!s)} style={{display:'none'}} id="menu-btn">☰</button>
          <span className="topbar-title">{pageTitles[page]}</span>
          <div className="topbar-search">
            <span style={{color:'var(--muted)',fontSize:13}}>🔍</span>
            <input placeholder="Search..." />
          </div>
          <div className="topbar-icon"><span>🔔</span><div className="notif-dot"></div></div>
          <select aria-label="Demo role switcher" value={currentUser.role} onChange={e=>switchDemoRole(e.target.value)} style={{background:'var(--surface-2)',border:'1px solid var(--border)',borderRadius:10,color:'var(--white)',padding:'8px 10px',fontSize:11,fontWeight:700}}>
            <option value="buyer">Demo: Buyer</option><option value="farmer">Demo: Farmer</option><option value="driver">Demo: Driver</option><option value="operations">Demo: Operations</option>
          </select>
          <Avatar name={currentUser.full_name} size={36} />
        </div>

        <div style={{flex:1,overflowY:'auto'}}>
          {page==='dashboard' && currentUser.role==='buyer' && <Dashboard onNavigate={navigate} />}
          {page==='dashboard' && currentUser.role==='farmer' && <FarmerDashboard onNavigate={navigate} />}
          {page==='dashboard' && currentUser.role==='driver' && <DriverDashboard onNavigate={navigate} />}
          {page==='dashboard' && (currentUser.role==='operations'||currentUser.role==='admin') && <OperationsDashboard />}
          {page==='market'    && <Marketplace onNavigate={navigate} />}
          {page==='orders'    && <Orders onNavigate={navigate} />}
          {page==='dispatch'  && <Dispatch onNavigate={navigate} />}
          {page==='tracking'  && <Tracking />}
          {page==='messages'  && <Messages />}
          {page==='payments'  && <Payments onNavigate={navigate} />}
          {page==='operations' && (currentUser.role==='operations'||currentUser.role==='admin') && <OperationsDashboard />}
          {page==='inventory'  && currentUser.role==='farmer' && <RoleWorkspace type="inventory" onNavigate={navigate} />}
          {page==='earnings'   && (currentUser.role==='farmer'||currentUser.role==='driver') && <RoleWorkspace type="earnings" onNavigate={navigate} />}
          {page==='jobs'       && currentUser.role==='driver' && <RoleWorkspace type="jobs" onNavigate={navigate} />}
          {page==='ussd'      && <USSD />}
        </div>
      </div>
    </div>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
